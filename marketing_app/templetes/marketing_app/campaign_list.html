<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Marketing Campaigns</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-primary">Marketing Campaigns</h1>
    <a href="{% url 'campaign_create' %}" class="btn btn-success mb-3">+ Create Campaign</a>
    <div class="list-group">
        {% for campaign in campaigns %}
            <a href="{% url 'lead_list' campaign.id %}" class="list-group-item list-group-item-action">
                <strong>{{ campaign.name }}</strong> <br>
                <small>{{ campaign.start_date }} → {{ campaign.end_date }}</small>
            </a>
        {% empty %}
            <p class="text-muted">No campaigns available.</p>
        {% endfor %}
    </div>
</div>
</body>
</html>
