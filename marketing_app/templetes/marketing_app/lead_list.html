<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-primary">Leads</h1>
    <a href="{% url 'lead_create' campaign_id=leads.0.campaign.id %}" class="btn btn-primary mb-3">+ Add Lead</a>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>Name</th><th>Email</th><th>Phone</th><th>Status</th>
        </tr>
        </thead>
        <tbody>
        {% for lead in leads %}
            <tr>
                <td>{{ lead.name }}</td>
                <td>{{ lead.email }}</td>
                <td>{{ lead.phone }}</td>
                <td>{{ lead.status }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="4" class="text-center text-muted">No leads found.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
